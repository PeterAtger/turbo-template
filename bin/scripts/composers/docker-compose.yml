services:
  web:
    container_name: web_container 
    build:
      context: ../../../
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    networks:
      - app_network
    env_file: "../../../apps/web/.env"

  cron:
    container_name: cron_container
    build:
      context: ../../../
      dockerfile: ./apps/cron/Dockerfile
    restart: always
    networks:
      - app_network
    env_file: "../../../apps/cron/.env"

networks:
  app_network:
    external: false

